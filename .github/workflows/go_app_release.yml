name: Release Docker Version

on:
  workflow_call:
    inputs:
      GH_CI_USER:
        description: 'User for GitHub auth'
        required: true
        type: string
      GOPRIVATE:
        description: 'GOPRIVATE env for go commands'
        required: false
        type: string
      LEGACY_DOCKER_MEDIATYPES:
        description: 'Push Docker schema2 manifest lists instead of OCI image indexes (required for legacy Mesos/Marathon Docker 17.x hosts)'
        required: false
        type: boolean
        default: false
      FREE_DISK_SPACE:
        description: 'Remove preinstalled toolchains and prune Docker images before building (~25-30GB reclaimed; for repos whose builds exhaust runner disk)'
        required: false
        type: boolean
        default: false
      PLATFORMS:
        description: 'Comma-separated Docker platforms to build (e.g. "linux/amd64" for repos whose dependencies are too large to compile for multiple platforms in parallel on a standard runner)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
    secrets:
      GH_CI_PAT:
        description: 'Token password for GitHub auth'
        required: true

      # Registry arguments.
      # Must supply set of arguments for at least 1 registry.

      # Artifact Registry arguments
      ARTIFACT_REGISTRY:
        description: 'Artifact Registry address to which to publish (leave blank to not publish)'
        required: false
      ARTIFACT_REGISTRY_JSON_KEY:
        description: 'Key for publishing to Artifact Registry'
        required: false

env:
  GOPRIVATE: ${{ inputs.GOPRIVATE }}

jobs:
  push:
    #
    # Build the Docker image artifact and deliver it.
    #
    runs-on: ubuntu-latest
    steps:
      # Checkout code needed to build docker image.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Setup Go.
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
          cache: false
      # Reclaim disk from preinstalled toolchains so large builds have headroom.
      - name: Free up runner disk space
        if: ${{ inputs.FREE_DISK_SPACE }}
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"; df -h /
      # Use auth to get access to private Git repos for Go code dependencies.
      - name: Configure git for private modules
        env:
          TOKEN: ${{ secrets.GH_CI_PAT }}
          GITHUB_USERNAME: ${{ inputs.GH_CI_USER }}
        run: git config --global url."https://${GITHUB_USERNAME}:${TOKEN}@github.com".insteadOf "https://github.com"
      # Vendor Go code needed to build docker image.
      - name: go mod vendor
        run: go mod vendor
      # Parse GitHub repository name for use in constructing docker image names.
      - name: Parse Repo Name
        id: parse_repo_name
        run: |
          echo "repo_name=$( echo '${{ github.repository }}' | awk -F '/' '{print $2}' )" >> $GITHUB_OUTPUT
      # Make the docker fields for Artifact Registry if we're pushing to it.
      - name: Construct Artifact Registry fields
        env:
          ARTIFACT_REGISTRY: ${{ secrets.ARTIFACT_REGISTRY }}
        if: ${{ env.ARTIFACT_REGISTRY }}
        run: |
          echo "ARTIFACT_REGISTRY_IMAGE_NAME=${{ secrets.ARTIFACT_REGISTRY }}/${{ github.repository }}" >> $GITHUB_ENV
      # Create docker image meta data. Docker tags include the Git tag itself and the sematic version parsing of that tag if possible.
      - name: Docker release meta
        id: release
        uses: docker/metadata-action@818d4b7b91585d195f67373fd9cb0332e31a7175 # v4.6.0
        with:
          images: |
            ${{ env.ARTIFACT_REGISTRY_IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
      # Login to Artifact Registry if we're pushing to it.
      - name: Login to Artifact Registry
        env:
          ARTIFACT_REGISTRY_JSON_KEY: ${{ secrets.ARTIFACT_REGISTRY_JSON_KEY }}
        if: ${{ env.ARTIFACT_REGISTRY_JSON_KEY }}
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ${{ secrets.ARTIFACT_REGISTRY }}
          username: _json_key
          password: ${{ secrets.ARTIFACT_REGISTRY_JSON_KEY }}
      # Setup QEMU needed to build arm64 images.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2.2.0
      # Setup Docker builder needed to build multi-architectural images.
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0
      # Build and push the image.
      - name: Build and Push to Artifact Registry
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          outputs: type=registry,oci-mediatypes=${{ inputs.LEGACY_DOCKER_MEDIATYPES && 'false' || 'true' }}
          provenance: false
          context: .
          file: Dockerfile
          platforms: ${{ inputs.PLATFORMS }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
          tags: ${{ steps.release.outputs.tags }}
          labels: ${{ steps.release.outputs.labels }}
